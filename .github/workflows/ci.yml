name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
      - name: Lint (erros de sintaxe e nomes indefinidos)
        run: ruff check --select E9,F63,F7,F82 src tests main.py
      - name: Build (compilação de bytecode)
        run: python -m compileall -q src main.py
      - name: Testes
        run: python -m pytest -p no:cacheprovider --no-cov -o log_cli=false
